version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 1 advisory = 1 PR だと今回のように 30 件超へ膨れるため、
    # patch/minor はまとめて 1 本の PR にする。
    groups:
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    # メジャー更新は PR を作らせない。実施コストが大きく、必要になった時点で
    # 手動で上げる方針 (例: HeroUI v3 は tailwindcss>=4 とセットの UI 移行案件)。
    #
    # 注意: `ignore` はセキュリティ更新にも効くため、メジャーでしか直らない CVE が
    # 出ても Dependabot は PR を作らない。ただし Dependabot *アラート* は
    # advisory DB から独立して出るので消えない。resolve-dependabot ルーティンは
    # alerts API を直接読むため検知でき、自動修正できない旨をトラッキング Issue に
    # 記録する。サイレントに握り潰される経路は無い。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
