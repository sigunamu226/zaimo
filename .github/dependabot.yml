version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 1 advisory = 1 PR だと今回のように 30 件超へ膨れるため、
    # patch/minor はまとめて 1 本の PR にする。
    groups:
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
