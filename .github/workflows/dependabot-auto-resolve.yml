name: Dependabot auto-resolve

# Anthropic Routine から移設した Dependabot アラート解決。
#
# 移設の理由: ルーティンの実行サンドボックスは npm レジストリにも
# Dependabot alerts API にも到達できず、13 日間「確認できなかった」を繰り返して
# 一度も修正を着地させられなかった (ルーティン作の PR 5 本中マージ 0 本)。
# Actions ランナーならレジストリに到達できるため、スキルはそのままで実行環境だけ移す。
#
# 構成:
#   detect  … 毎日走る安価な検知。起動すべきものが無ければ以降を回さない
#   resolve … 対応対象があるときだけエージェントを起動し、
#             .claude/skills/resolve-dependabot を autonomous モードで実行する
#   notify  … API キー未設定で対応対象がある場合に人間へ知らせる
#
# トークンについて (2026-09-01 実測):
#   GITHUB_TOKEN では Dependabot alerts API が 403 "Resource not accessible by
#   integration" になる。permissions に security-events: read を足しても不可。
#   正確なアラート数が要る場合は Dependabot alerts: read を持つ fine-grained PAT を
#   DEPENDABOT_ALERTS_TOKEN シークレットに登録する。
#   未設定でも落とさず、Dependabot 自身の open PR の有無で代替判定して動き続ける
#   (毎日ワークフローを失敗させて通知を撒かないため)。

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: read

concurrency:
  group: dependabot-auto-resolve
  cancel-in-progress: false

jobs:
  detect:
    name: detect work
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      alerts_available: ${{ steps.alerts.outputs.available }}
      alert_count: ${{ steps.alerts.outputs.count }}
      alert_summary: ${{ steps.alerts.outputs.summary }}
      pr_count: ${{ steps.prs.outputs.count }}
      pr_summary: ${{ steps.prs.outputs.summary }}
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - name: Read open Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if raw=$(gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" 2>&1); then
            count=$(echo "$raw" | jq 'length')
            summary=$(echo "$raw" | jq -r '[.[] | "#\(.number) \(.security_advisory.severity) \(.dependency.package.name) -> \(.security_vulnerability.first_patched_version.identifier // "none")"] | join("\n")')
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "open alerts: $count"
          else
            # 落とさない。毎日失敗させると通知が撒かれ、移設前の Issue 濫造と同じ害になる
            echo "::warning::Dependabot alerts API を読めません。DEPENDABOT_ALERTS_TOKEN (fine-grained PAT, Dependabot alerts: read) を設定すると正確なアラート数で判定できます。今回は Dependabot PR の有無で代替判定します。"
            echo "$raw" | head -3
            summary=""
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "count=unknown" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "summary<<ALERTS_EOF"
            echo "$summary"
            echo "ALERTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read open Dependabot PRs (fallback signal)
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          raw=$(gh pr list --repo "$REPO" --state open --app dependabot --json number,title 2>/dev/null || echo '[]')
          count=$(echo "$raw" | jq 'length')
          summary=$(echo "$raw" | jq -r '[.[] | "#\(.number) \(.title)"] | join("\n")')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<PRS_EOF"
            echo "$summary"
            echo "PRS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "open dependabot PRs: $count"

      - name: Check whether an API key is configured
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 未設定のためエージェントによる自動修正は行いません。"
          fi

      - name: Decide whether there is work to do
        id: decide
        env:
          AVAILABLE: ${{ steps.alerts.outputs.available }}
          ALERTS: ${{ steps.alerts.outputs.count }}
          PRS: ${{ steps.prs.outputs.count }}
        run: |
          set -uo pipefail
          should_run=false
          if [ "$AVAILABLE" = "true" ]; then
            # アラート数が読めた場合はそれが唯一の判断材料
            [ "$ALERTS" != "0" ] && should_run=true
          else
            # 読めない場合は Dependabot PR の有無で代替。
            # Dependabot が手を出せないアラート (内部ピン等) は取りこぼす。
            [ "$PRS" != "0" ] && should_run=true
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run (alerts_available=$AVAILABLE alerts=$ALERTS prs=$PRS)"

  resolve:
    name: resolve with agent
    needs: detect
    if: needs.detect.outputs.should_run == 'true' && needs.detect.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Enable corepack
        run: corepack enable

      - name: Run the resolve-dependabot skill
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            autonomous mode / routine 実行です。人間は居ません。

            リポジトリ内の `.claude/skills/resolve-dependabot/SKILL.md` を読み、
            その手順を autonomous モード (§0) で実行してください。

            この実行環境は npm レジストリに到達できます。§0.6 の BLOCKED 経路ではなく
            通常経路 (§6 適用 → §7 lint/build → §8.5 PR + auto-merge) を使ってください。

            Dependabot alerts API が読めたか: ${{ needs.detect.outputs.alerts_available }}
            open アラート数: ${{ needs.detect.outputs.alert_count }}
            ${{ needs.detect.outputs.alert_summary }}

            open Dependabot PR: ${{ needs.detect.outputs.pr_count }} 件
            ${{ needs.detect.outputs.pr_summary }}

            alerts_available が false の場合、アラート一覧は取得できていません。
            §9.5 のとおり「確認できなかった」と明記し、推測で 0 と書かないでください。

            終了時は §10 のフォーマットで、§9 の着地確認を必ず含めて報告してください。

  notify:
    name: notify (no API key)
    needs: detect
    if: needs.detect.outputs.should_run == 'true' && needs.detect.outputs.has_key != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AVAILABLE: ${{ needs.detect.outputs.alerts_available }}
          ALERTS: ${{ needs.detect.outputs.alert_count }}
          ALERT_SUMMARY: ${{ needs.detect.outputs.alert_summary }}
          PRS: ${{ needs.detect.outputs.pr_count }}
          PR_SUMMARY: ${{ needs.detect.outputs.pr_summary }}
        run: |
          set -uo pipefail
          TITLE="Dependabot auto-resolve: status"
          BODY=$(printf '## %s — 対応対象あり\n\n- Dependabot alerts API 読み取り: %s\n- open アラート: %s\n- open Dependabot PR: %s 件\n\n```\n%s\n%s\n```\n\n`ANTHROPIC_API_KEY` が未設定のため自動修正は実行していません。\nローカルで `/resolve-dependabot` を実行するか、シークレットを設定してください。\n' \
            "$(date -u +%Y-%m-%d)" "$AVAILABLE" "$ALERTS" "$PRS" "$ALERT_SUMMARY" "$PR_SUMMARY")
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
